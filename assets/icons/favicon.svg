<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="psGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="psGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="#0d0f14" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#psGrad)" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Stylized Prince Studio 'P' -->
  <path d="M22 18 H35 C42 18 46 22 46 28 C46 34 42 38 35 38 H29 V46 H22 Z" fill="url(#psGrad)" filter="url(#psGlow)" />
  <circle cx="33" cy="28" r="4.5" fill="#0d0f14" />
  
  <!-- Code bracket accent -->
  <path d="M43 40 L49 45 L43 50" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
